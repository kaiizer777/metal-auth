name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --locked --all-targets
      - run: cargo check --locked --all-targets --no-default-features --features mysql
      - run: cargo check --locked --all-targets --no-default-features --features mongodb
      - run: cargo check --locked --all-targets --all-features
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --no-default-features --features mysql -- -D warnings
      - run: cargo clippy --locked --all-targets --no-default-features --features mongodb -- -D warnings
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metal_auth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d metal_auth_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/metal_auth_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/localhost/5432) 2>/dev/null && exit 0
            sleep 2
          done
          exit 1
      - run: cargo test --locked --lib
      - run: cargo test --locked --doc

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metal_auth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d metal_auth_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: metal_auth_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/metal_auth_test
      MYSQL_DATABASE_URL: mysql://root:root@127.0.0.1:3306/metal_auth_test
      MONGODB_URI: mongodb://127.0.0.1:27017/metal_auth_test?replicaSet=rs0&directConnection=true
      MONGO_DATABASE: metal_auth_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/localhost/5432) 2>/dev/null && exit 0
            sleep 2
          done
          exit 1
      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/localhost/3306) 2>/dev/null && exit 0
            sleep 2
          done
          exit 1
      - name: Start MongoDB Replica Set
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:6 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongodb mongosh --eval "db.adminCommand({ ping: 1 })" >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec mongodb mongosh --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] })' >/dev/null 2>&1
          for i in $(seq 1 30); do
            docker exec mongodb mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -q '^true$' && exit 0
            sleep 1
          done
          echo "MongoDB replica set primary election timed out"
          exit 1
      - run: cargo test --locked --test auth_journey_tests -- --test-threads=1
      - run: cargo test --locked --test password_reset_journey_tests -- --test-threads=1
      - run: cargo test --locked --test security_edge_journey_tests -- --test-threads=1
      - run: cargo test --locked --test boot_test -- --test-threads=1
      - run: cargo test --locked --test email_test -- --test-threads=1
      - run: cargo test --locked --test env_config_test -- --test-threads=1
      - run: cargo test --locked --test security_tests -- --test-threads=1
      - run: cargo test --locked --test oauth_service_test -- --test-threads=1
      - run: cargo test --locked --test oauth_security_test -- --test-threads=1
      - run: cargo test --locked --test oauth_integration_test -- --test-threads=1
      - run: cargo test --locked --test totp_handler_test -- --test-threads=1
      - run: cargo test --locked --test totp_e2e_test -- --test-threads=1
      - run: cargo test --locked --test totp_migration_test -- --test-threads=1
      - run: cargo test --locked --test totp_security_test -- --test-threads=1
      - run: cargo test --locked --test mysql_store_test --no-default-features --features mysql -- --test-threads=1
      - run: cargo test --locked --test mysql_e2e_test --no-default-features --features mysql -- --test-threads=1
      - run: cargo test --locked --test boot_test --no-default-features --features mysql -- --test-threads=1
      - run: cargo test --locked --test mongo_store_test --no-default-features --features mongodb -- --test-threads=1
      - run: cargo test --locked --test mongo_e2e_test --no-default-features --features mongodb -- --test-threads=1
      - run: cargo test --locked --test boot_test --no-default-features --features mongodb -- --test-threads=1
      - run: cargo test --locked --test adapter_security_test --all-features -- --test-threads=1

  msrv:
    name: MSRV (1.94)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metal_auth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d metal_auth_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/metal_auth_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/localhost/5432) 2>/dev/null && exit 0
            sleep 2
          done
          exit 1
      - run: cargo check --locked --all-targets
      - run: cargo check --locked --all-targets --all-features
      - run: cargo test --locked --lib
      - run: cargo test --locked --test auth_journey_tests -- --test-threads=1
      - run: cargo test --locked --test password_reset_journey_tests -- --test-threads=1
      - run: cargo test --locked --test security_edge_journey_tests -- --test-threads=1
      - run: cargo test --locked --test boot_test -- --test-threads=1
      - run: cargo test --locked --test email_test -- --test-threads=1
      - run: cargo test --locked --test env_config_test -- --test-threads=1
      - run: cargo test --locked --test security_tests -- --test-threads=1
      - run: cargo test --locked --test oauth_service_test -- --test-threads=1
      - run: cargo test --locked --test oauth_security_test -- --test-threads=1
      - run: cargo test --locked --test oauth_integration_test -- --test-threads=1
      - run: cargo test --locked --test totp_handler_test -- --test-threads=1
      - run: cargo test --locked --test totp_e2e_test -- --test-threads=1
      - run: cargo test --locked --test totp_migration_test -- --test-threads=1
      - run: cargo test --locked --test totp_security_test -- --test-threads=1

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metal_auth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d metal_auth_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: metal_auth_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/metal_auth_test
      MYSQL_DATABASE_URL: mysql://root:root@127.0.0.1:3306/metal_auth_test
      MONGODB_URI: mongodb://127.0.0.1:27017/metal_auth_test?replicaSet=rs0&directConnection=true
      MONGO_DATABASE: metal_auth_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@3f7c3597aa4e6da3f315e128de702ce61e7b2877 # cargo-llvm-cov
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/localhost/5432) 2>/dev/null && exit 0
            sleep 2
          done
          exit 1
      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/localhost/3306) 2>/dev/null && exit 0
            sleep 2
          done
          exit 1
      - name: Start MongoDB Replica Set
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:6 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongodb mongosh --eval "db.adminCommand({ ping: 1 })" >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec mongodb mongosh --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] })' >/dev/null 2>&1
          for i in $(seq 1 30); do
            docker exec mongodb mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -q '^true$' && exit 0
            sleep 1
          done
          echo "MongoDB replica set primary election timed out"
          exit 1
      - run: cargo llvm-cov --locked --tests --all-features --lcov --output-path lcov.info --fail-under-lines 70 -- --test-threads 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov-report
          path: lcov.info

  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  release-build:
    name: Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked --release
