name: Copilot PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: copilot-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  copilot-review:
    name: Request Copilot PR Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request Copilot Code Review
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request ? context.payload.pull_request.number : context.issue.number;
            try {
              await github.request('POST /repos/{owner}/{repo}/pulls/{pull_number}/copilot-code-review', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                headers: {
                  'X-GitHub-Api-Version': '2022-11-28'
                }
              });
              core.info(`Copilot PR review requested successfully for PR #${prNumber}`);
            } catch (error) {
              core.warning(`Copilot PR review request skipped or failed for PR #${prNumber}: ${error.message}`);
              if (error.status) {
                core.info(`HTTP Status: ${error.status}`);
              }
              if (error.response && error.response.data) {
                core.info(`Response details: ${JSON.stringify(error.response.data)}`);
              }
            }
