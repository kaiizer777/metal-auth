[package]
name = "metal-auth"
version = "0.1.0"
edition = "2024"
description = "A composable, modular authentication library for Rust"
repository = "https://github.com/kaiizer777/metal-auth"
license = "MIT"
readme = "README.md"
keywords = ["auth", "authentication", "session", "oauth2", "security"]
categories = ["authentication", "web-programming"]

[dependencies]
# async runtime
tokio = { version = "1", features = ["macros", "rt", "time", "sync"] }

# crypto (Phase 3)
argon2 = { version = "0.5", features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"

# async trait (dyn-compatible email hook)
async-trait = "0.1"

# web framework
axum = "0.7"

# DB
sqlx = { version = "0.8", features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "macros",
    "uuid",
    "chrono",
    "migrate",
] }

# middleware
tower-http = { version = "0.7", features = ["cors", "trace"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# types
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# error handling
thiserror = "2"

# env
dotenvy = "0.15"

# tracing
tracing = "0.1"

[features]
default = []
test-utils = []

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
tower = { version = "0.4", features = ["util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
