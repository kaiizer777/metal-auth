[package]
name = "metal-auth"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "A composable, modular authentication library for Rust"
repository = "https://github.com/kaiizer777/metal-auth"
license = "MIT"
readme = "README.md"
keywords = ["auth", "authentication", "session", "oauth2", "security"]
categories = ["authentication", "web-programming"]
autotests = true

[dependencies]
# async runtime
tokio = { version = "1", features = ["macros", "rt", "time", "sync"] }

# crypto (Phase 3, 6 & 7)
argon2 = { version = "0.5", features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.11"
sha1 = "0.11"
hex = "0.4"
subtle = "2.6"
base64 = "0.22"
hmac = "0.13"
aes-gcm = "0.10"
base32 = "0.4"
jsonwebtoken = "12"

# HTTP client for OAuth (Phase 6)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# rate limiting (Phase 4)
dashmap = "6"

# async trait (dyn-compatible email hook)
async-trait = "0.1"

# web framework
axum = "0.8"

# DB
sqlx = { version = "0.9", optional = true, default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "macros",
    "uuid",
    "chrono",
    "migrate",
    "json",
] }
mongodb = { version = "3", optional = true }
bson = { version = "2", optional = true, features = ["chrono-0_4", "uuid-1"] }

# middleware
tower-http = { version = "0.7", features = ["cors", "trace"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# types
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# error handling
thiserror = "2"

# env
dotenvy = "0.15"

# tracing
tracing = "0.1"

[features]
default = ["postgres"]
postgres = ["dep:sqlx", "sqlx/postgres"]
# sqlx/postgres below is a transitional bridge: the PgPool-typed service surface
# (#120) must resolve under non-postgres builds until #119 retypes it store-backed.
mysql = ["dep:sqlx", "sqlx/mysql", "sqlx/postgres"]
mongodb = ["dep:mongodb", "dep:bson", "dep:sqlx", "sqlx/postgres"]
test-utils = []

[dev-dependencies]
metal-auth = { path = ".", version = "0.1.0", features = ["test-utils"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6"

# Argon2 is the dominant cost of the DB-backed test suites. Optimizing only the
# hashing crates in the test profile is codegen-only: same m/t/p, same PHC output.
[profile.test.package.argon2]
opt-level = 3

[profile.test.package.blake2]
opt-level = 3
