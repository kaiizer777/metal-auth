[graph]
targets = []
[advisories]
version = 2
yanked = "warn"
ignore = ["RUSTSEC-2026-0459"]
[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "Unicode-3.0", "CDLA-Permissive-2.0"]
confidence-threshold = 0.8
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[[licenses.clarify]]
crate = "flume"
expression = "Apache-2.0 OR MIT"
license-files = [{ path = "LICENSE-MIT", hash = 0x0 }, { path = "LICENSE-APACHE", hash = 0x0 }]

[[licenses.clarify]]
crate = "serde_urlencoded"
expression = "MIT OR Apache-2.0"
license-files = [{ path = "LICENSE-MIT", hash = 0x0 }, { path = "LICENSE-APACHE", hash = 0x0 }]

[[licenses.clarify]]
crate = "stringprep"
expression = "MIT OR Apache-2.0"
license-files = [{ path = "LICENSE-MIT", hash = 0x0 }, { path = "LICENSE-APACHE", hash = 0x0 }]

[[licenses.clarify]]
crate = "vcpkg"
expression = "MIT OR Apache-2.0"
license-files = [{ path = "LICENSE-MIT", hash = 0x0 }, { path = "LICENSE-APACHE", hash = 0x0 }]

[[licenses.clarify]]
crate = "version_check"
expression = "MIT OR Apache-2.0"
license-files = [{ path = "LICENSE-MIT", hash = 0x0 }, { path = "LICENSE-APACHE", hash = 0x0 }]
